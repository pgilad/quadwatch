name: release

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Trigger for both Israeli offsets, then keep the one
    # corresponding to 08:00 in Asia/Jerusalem in the preflight job.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-26.04
    outputs:
      latest_tag: ${{ steps.candidate.outputs.latest_tag }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      should_release: ${{ steps.candidate.outputs.should_release }}
      resume_tag: ${{ steps.candidate.outputs.resume_tag }}
    steps:
      - name: Select the 08:00 Israel-time schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_run=true
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            israel_offset="$(TZ=Asia/Jerusalem date +%z)"
            case "${israel_offset}:${EVENT_SCHEDULE}" in
              '+0300:0 5 * * *'|'+0200:0 6 * * *') ;;
              *) should_run=false ;;
            esac
          fi
          printf 'should_run=%s\n' "${should_run}" >> "${GITHUB_OUTPUT}"
      - name: Ensure manual releases are dispatched from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "error: releases can only be dispatched from refs/heads/main" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.schedule.outputs.should_run == 'true'
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve release candidate
        id: candidate
        if: steps.schedule.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          latest_tag="$(git tag --merged HEAD --list '[0-9]*' --sort=-v:refname | sed -n '1p')"
          should_release=true
          resume_tag=""

          if [[ -n "${latest_tag}" ]]; then
            tagged_sha="$(git rev-list -n 1 "${latest_tag}")"
            release_status="$(bash scripts/publish-release.sh status "${GITHUB_REPOSITORY}" "${latest_tag}")"
            if [[ "${release_status}" == incomplete ]]; then
              candidate_sha="${tagged_sha}"
              resume_tag="${latest_tag}"
            elif [[ "${tagged_sha}" == "${candidate_sha}" ]]; then
              should_release=false
            fi
          fi

          {
            printf 'latest_tag=%s\n' "${latest_tag}"
            printf 'candidate_sha=%s\n' "${candidate_sha}"
            printf 'should_release=%s\n' "${should_release}"
            printf 'resume_tag=%s\n' "${resume_tag}"
          } >> "${GITHUB_OUTPUT}"
      - name: Skip when main has no unreleased commits
        if: steps.schedule.outputs.should_run == 'true' && steps.candidate.outputs.should_release != 'true'
        run: echo "No unreleased commits on main since ${{ steps.candidate.outputs.latest_tag }}."

  lint:
    if: needs.preflight.outputs.should_release == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    if: needs.preflight.outputs.should_release == 'true'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race ./...

  release_smoke:
    if: needs.preflight.outputs.should_release == 'true'
    needs: preflight
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise release and installer
        run: ./scripts/test-release.sh

  prepare_release:
    if: needs.preflight.outputs.should_release == 'true'
    needs:
      - preflight
      - lint
      - test
      - release_smoke
    runs-on: ubuntu-26.04
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Prepare release
        id: release
        env:
          RESUME_TAG: ${{ needs.preflight.outputs.resume_tag }}
        run: |
          if [[ -z "${RESUME_TAG}" ]]; then
            ./scripts/prepare-release.sh "${GITHUB_RUN_NUMBER}"
          else
            mkdir -p target/release
            awk -v header="## ${RESUME_TAG}" '
              $0 == header { found = 1 }
              found && /^## / && $0 != header { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > target/release/notes.md
            {
              printf 'release_version=%s\n' "${RESUME_TAG}"
              printf 'release_notes_path=%s\n' target/release/notes.md
            } >> "${GITHUB_OUTPUT}"
          fi
      - name: Render release installer
        run: ./scripts/render-installer.sh "${{ steps.release.outputs.release_version }}" target/release/metadata/install.sh
      - name: Create release commit and tag bundle
        id: commit
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RESUME_TAG: ${{ needs.preflight.outputs.resume_tag }}
        run: |
          if [[ -n "${RESUME_TAG}" ]]; then
            test "$(git rev-parse "refs/tags/${RESUME_TAG}^{commit}")" = "${CANDIDATE_SHA}"
            printf 'release_sha=%s\n' "${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "error: prepare-release did not update CHANGELOG.md" >&2
            exit 1
          fi
          git commit -m "chore(release): ${RELEASE_VERSION}"
          release_sha="$(git rev-parse HEAD)"
          git tag -a "${RELEASE_VERSION}" -m "${RELEASE_VERSION}"
          git branch release-candidate "${release_sha}"
          git bundle create target/release/metadata/release.bundle \
            refs/heads/release-candidate \
            "refs/tags/${RELEASE_VERSION}" \
            "^${CANDIDATE_SHA}"
          git bundle verify target/release/metadata/release.bundle
          printf 'release_sha=%s\n' "${release_sha}" >> "${GITHUB_OUTPUT}"
      - name: Stage release metadata
        run: |
          mkdir -p target/release/metadata
          cp CHANGELOG.md target/release/metadata/CHANGELOG.md
          cp "${{ steps.release.outputs.release_notes_path }}" target/release/metadata/release-notes.md
      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: target/release/metadata/*
          if-no-files-found: error

  build_release:
    if: needs.preflight.outputs.should_release == 'true'
    needs:
      - preflight
      - prepare_release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download prepared metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: target/release/metadata
      - name: Restore exact release commit and tag
        env:
          RELEASE_SHA: ${{ needs.prepare_release.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          if [[ -f target/release/metadata/release.bundle ]]; then
            git fetch target/release/metadata/release.bundle \
              refs/heads/release-candidate \
              "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
          fi
          git checkout --detach "${RELEASE_SHA}"
          test "$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain)"
      - name: Package release archive
        run: ./scripts/package-release.sh "${{ needs.prepare_release.outputs.release_version }}" target/release/dist --target "${{ matrix.target }}"
      - name: Verify release archive
        run: ./scripts/verify-release.sh "${{ needs.prepare_release.outputs.release_version }}" "${{ matrix.target }}" target/release/dist "${{ needs.prepare_release.outputs.release_sha }}"
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/release/dist/*.tar.gz"
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ matrix.target }}
          path: target/release/dist/*
          if-no-files-found: error

  publish_release:
    if: needs.preflight.outputs.should_release == 'true'
    needs:
      - preflight
      - prepare_release
      - build_release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: target/release/metadata
      - name: Restore exact release commit and tag
        env:
          RELEASE_SHA: ${{ needs.prepare_release.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          if [[ -f target/release/metadata/release.bundle ]]; then
            git fetch target/release/metadata/release.bundle \
              refs/heads/release-candidate \
              "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
          fi
          git checkout --detach "${RELEASE_SHA}"
          test "$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain)"
      - name: Download packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dist-*
          path: target/release/dist
          merge-multiple: true
      - name: Push prepared release refs
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          tag_ref="refs/tags/${RELEASE_VERSION}"
          remote_tag="$(git ls-remote origin "${tag_ref}")"
          if [[ -n "${remote_tag}" ]]; then
            test "${remote_tag%%$'\t'*}" = "$(git rev-parse "${tag_ref}")"
            exit 0
          fi
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${CANDIDATE_SHA}" ]]; then
            echo "error: main advanced to ${current_main} after this release started; rerun the workflow to release the latest tip" >&2
            exit 1
          fi
          git push --atomic origin HEAD:refs/heads/main "${tag_ref}"
      - name: Check out publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/release/workflow
          persist-credentials: false
      - name: Publish GitHub release
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          bash target/release/workflow/scripts/publish-release.sh publish "${GITHUB_REPOSITORY}" \
            "${RELEASE_VERSION}" target/release/dist target/release/metadata
